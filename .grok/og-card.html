<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Fraunces";
      font-weight: 600;
      src: url("fonts/Fraunces-600.ttf") format("truetype");
    }
    @font-face {
      font-family: "Fraunces";
      font-weight: 700;
      src: url("fonts/Fraunces-700.ttf") format("truetype");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-weight: 400;
      src: url("fonts/IBMPlexMono-400.ttf") format("truetype");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-weight: 500;
      src: url("fonts/IBMPlexMono-500.ttf") format("truetype");
    }
    @font-face {
      font-family: "IBM Plex Sans";
      font-weight: 500;
      src: url("fonts/IBMPlexSans-500.ttf") format("truetype");
    }
    @font-face {
      font-family: "IBM Plex Sans";
      font-weight: 600;
      src: url("fonts/IBMPlexSans-600.ttf") format("truetype");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F3EFE6;
    }
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background: #F3EFE6;
      color: #141210;
      overflow: hidden;
    }

    .grain {
      position: absolute;
      inset: 0;
      background: url("paper-grain.jpg") center / cover no-repeat;
      opacity: 0.2;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .teal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 16px;
      background: #0C6E5A;
    }

    .frame {
      position: absolute;
      top: 36px;
      left: 28px;
      right: 28px;
      bottom: 28px;
      border: 1.5px solid #141210;
    }
    .frame-inner {
      position: absolute;
      top: 42px;
      left: 34px;
      right: 34px;
      bottom: 34px;
      border: 0.75px solid rgba(20, 18, 16, 0.32);
    }

    .eyebrow {
      position: absolute;
      top: 58px;
      left: 64px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #141210;
    }

    .main {
      position: absolute;
      top: 52px;
      left: 64px;
      width: 780px;
      height: 526px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .mark {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: #141210;
      margin-bottom: 20px;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: 68px;
      line-height: 0.98;
      letter-spacing: -0.02em;
      color: #141210;
      font-optical-sizing: auto;
    }
    h1 span { display: block; }

    .rule {
      width: 168px;
      height: 3px;
      background: #0C6E5A;
      margin: 28px 0 18px;
    }

    .stats {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.045em;
      color: #141210;
    }

    .perf {
      position: absolute;
      top: 42px;
      bottom: 42px;
      left: 898px;
      width: 14px;
      background-image: repeating-linear-gradient(
        to bottom,
        #141210 0 7px,
        transparent 7px 16px
      );
      background-position: center;
      background-size: 2px 100%;
      background-repeat: no-repeat;
    }
    .perf::before,
    .perf::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      border-radius: 50%;
      background: #F3EFE6;
      box-shadow: inset 0 0 0 1.5px #141210;
    }
    .perf::before { top: -2px; }
    .perf::after { bottom: -2px; }

    .stub {
      position: absolute;
      top: 58px;
      right: 52px;
      width: 210px;
      height: 514px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 14px;
    }

    .stub-mark {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .stub-seat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .stub-seat .lbl {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
    }
    .stub-seat .num {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: 96px;
      line-height: 0.82;
      letter-spacing: -0.04em;
    }

    .stub-free {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #141210;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="grain"></div>
    <div class="teal"></div>
    <div class="frame"></div>
    <div class="frame-inner"></div>

    <div class="eyebrow">NxtWave workshop</div>

    <div class="main">
      <div class="mark">SHIP60</div>
      <h1>
        <span>Build Your First</span>
        <span>AI Project in</span>
        <span>60 Minutes</span>
      </h1>
      <div class="rule"></div>
      <div class="stats">500 seats · 7 days · ₹2000</div>
    </div>

    <div class="perf" aria-hidden="true"></div>

    <div class="stub">
      <div class="stub-mark">SHIP60</div>
      <div class="stub-seat">
        <div class="lbl">Seat</div>
        <div class="num">60</div>
      </div>
      <div class="stub-free">Admit one</div>
    </div>
  </div>
</body>
</html>
